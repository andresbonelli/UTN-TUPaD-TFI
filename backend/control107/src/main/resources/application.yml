spring:
  application:
    name: emergencias107

  profiles:
    active: dev

  datasource:
    url: "jdbc:h2:file:./data/emergencias107;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1"
    driverClassName: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.springframework: warn
app:
  cors:
    allowed-origins: "*"