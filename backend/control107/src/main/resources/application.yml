spring:
  application:
    name: control107

  profiles:
    active: dev

  datasource:
    url: "jdbc:h2:file:./data/control107;DB_CLOSE_DELAY=-1"
    driverClassName: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    user:
      name: ${SECURITY_USER_NAME:admin}
      password: ${SECURITY_USER_PWD:admin}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operationsSorter: method

logging:
  level:
    org.springframework: warn

app:
  cors:
    allowed-origins: "${FRONTEND_HOST:http://localhost:5173}"
  data-loader:
    enabled: true

security:
  jwt:
    expiration-time: 86400000

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api

management:
  server:
    port: 9001
  endpoints:
    web:
      exposure:
        include: "*"